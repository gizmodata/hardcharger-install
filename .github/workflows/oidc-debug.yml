name: OIDC claims (debug)

# Prints the claims of this repo's GitHub OIDC token (never the token itself), so the AWS
# role's trust policy can match the real `sub`. Run by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/oidc-debug.yml]

permissions:
  id-token: write
  contents: read

jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the token's claims
        run: |
          set -eu
          tok=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "::add-mask::$tok"
          payload=$(printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, iss, repository, repository_id, repository_owner_id, ref, job_workflow_ref}'

name: Test installers

# Runs install.sh and install.ps1 end to end against the real gizmodata/hardcharger releases.
#
# Triggers (a quiet repo's schedule is disabled by GitHub after 60 days, so the schedule is only
# a backstop):
#   - every pull request and every push (main's pushes run it through deploy.yml, which
#     publishes only after it passes);
#   - repository_dispatch `hardcharger-released` from hardcharger's release workflow, with
#     client_payload.version;
#   - workflow_call, from deploy.yml (which publishes the installer only if this passes);
#   - weekly schedule and workflow_dispatch.
#
# Token: while hardcharger is internal, its release assets need a token that can read it. A
# repo's GITHUB_TOKEN can't read another repo, so runs in this repo use the
# HARDCHARGER_RELEASES_TOKEN secret: a fine-grained token, resource owner gizmodata, repository
# gizmodata/hardcharger only, Contents: read-only. The token is never printed.

on:
  pull_request:
  push:
    branches-ignore: [main]
  repository_dispatch:
    types: [hardcharger-released]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Hardcharger version to test (X.Y.Z). Empty = latest.
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: Hardcharger version to test (X.Y.Z). Empty = latest.
        required: false
        default: ''
        type: string
    secrets:
      HARDCHARGER_RELEASES_TOKEN:
        required: false

permissions:
  contents: read

# Superseded runs on a branch are cancelled, never a run on a tag. The prefix keeps this group
# apart from a caller's (deploy.yml, release.yml): a called workflow's github.workflow is the
# caller's name, and sharing the caller's group would deadlock the run.
concurrency:
  group: test-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  HC_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
  HARDCHARGER_INSTALL_TOKEN: ${{ secrets.HARDCHARGER_RELEASES_TOKEN || github.token }}

jobs:
  lint:
    name: Lint and platform unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh install.sh .github/scripts/*.sh
      - name: Syntax check with dash and bash
        run: dash -n install.sh && bash -n install.sh
      - name: Platform checks with fake uname/getconf/ldd (dash, bash)
        run: |
          .github/scripts/platform-tests.sh dash
          .github/scripts/platform-tests.sh bash
      - name: Parse and analyze install.ps1
        shell: pwsh
        run: |
          $t = $null; $e = $null
          foreach ($f in 'install.ps1', '.github/scripts/windows-tests.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e; exit 1 }
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error -EnableExit
  token:
    name: Token can read hardcharger's releases
    runs-on: ubuntu-24.04
    steps:
      - name: The token can read hardcharger's releases
        run: |
          printf 'Authorization: Bearer %s\n' "$HARDCHARGER_INSTALL_TOKEN" > "$RUNNER_TEMP/h"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H @"$RUNNER_TEMP/h" https://api.github.com/repos/gizmodata/hardcharger/releases/latest)
          rm -f "$RUNNER_TEMP/h"
          if [ "$code" != 200 ]; then
            echo "::error::the token can't read gizmodata/hardcharger's releases (HTTP $code). Set the HARDCHARGER_RELEASES_TOKEN secret: a fine-grained token for gizmodata/hardcharger with Contents: read-only."
            exit 1
          fi

  unix:
    name: ${{ matrix.name }}
    needs: [lint, token]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64 (ubuntu-24.04, dash), runner: ubuntu-24.04, port: 31400 }
          - { name: linux-arm64 (ubuntu-24.04-arm, dash), runner: ubuntu-24.04-arm, port: 31420 }
          - { name: macos-arm64 (macos-15, sh), runner: macos-15, port: 31440 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install, smoke test, switch, downgrade, checksums, anonymous, uninstall
        env:
          PORT: ${{ matrix.port }}
          SH: sh
        run: .github/scripts/scenarios.sh "$HC_VERSION"

  container:
    name: ${{ matrix.name }}
    needs: [lint, token]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13 container (amd64), runner: ubuntu-24.04, image: 'debian:13' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - run: apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null
      - uses: actions/checkout@v7
      - name: All scenarios
        env:
          SH: sh
        run: .github/scripts/scenarios.sh "$HC_VERSION"

  # Releases up to 0.2.0 were built on Ubuntu 24.04 and need glibc 2.38. The manylinux_2_28
  # builds (glibc 2.28, OpenSSL linked in) come from hardcharger's branch feature/ci-speed.
  # Until they ship, these systems can't run Hardcharger, and the installer must say so plainly.
  glibc-message:
    name: glibc message (${{ matrix.name }})
    needs: [lint, token]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'debian-12 arm64, Raspberry Pi OS Bookworm base, glibc 2.36', runner: ubuntu-24.04-arm, image: 'debian:12', glibc: '2.36' }
          - { name: 'oraclelinux-8 amd64, glibc 2.28', runner: ubuntu-24.04, image: 'oraclelinux:8', glibc: '2.28' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - run: command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
      - uses: actions/checkout@v7
      - name: The installer installs, or explains the glibc gap before downloading
        run: |
          set +e
          out="$(HARDCHARGER_VERSION="${HC_VERSION:-latest}" sh install.sh 2>&1)"; code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" = 0 ]; then echo "installed: this release runs on glibc ${{ matrix.glibc }}"; exit 0; fi
          printf '%s\n' "$out" | grep -E "needs glibc >= 2\.[0-9]+, and this system has glibc ${{ matrix.glibc }}\." \
            || { echo "::error::the installer failed without the glibc explanation"; exit 1; }
          if printf '%s\n' "$out" | grep -F "Downloading" ; then echo "::error::it downloaded before refusing"; exit 1; fi
          [ -z "$(ls -A "$HOME/.hardcharger/versions" 2>/dev/null)" ] || { echo "::error::it left a version behind"; exit 1; }

  known-failing:
    name: known failing until manylinux_2_28 (${{ matrix.name }})
    needs: [lint, token]
    # Expected to fail until hardcharger's feature/ci-speed (manylinux_2_28 Linux builds) is
    # released; the glibc-message job above is the one that must pass meanwhile.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-12 arm64, runner: ubuntu-24.04-arm, image: 'debian:12' }
          - { name: oraclelinux-8 amd64, runner: ubuntu-24.04, image: 'oraclelinux:8' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - run: command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
      - uses: actions/checkout@v7
      - name: All scenarios
        env:
          SH: sh
        run: .github/scripts/scenarios.sh "$HC_VERSION"

  windows:
    name: ${{ matrix.name }}
    needs: [lint, token]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64 (windows-2025), runner: windows-2025 }
          - { name: windows-arm64 (windows-11-arm), runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell 7
        shell: pwsh
        env:
          HARDCHARGER_VERSION: ${{ env.HC_VERSION }}
        run: ./.github/scripts/windows-tests.ps1
      - name: Windows PowerShell 5.1
        shell: powershell
        env:
          HARDCHARGER_VERSION: ${{ env.HC_VERSION }}
        run: |
          .\.github\scripts\windows-tests.ps1
          exit $LASTEXITCODE

name: Test installers

# Two kinds of tests:
#
# - Fixture tests (lint, platform unit tests, fixture-scenarios.sh, windows-tests.ps1, the glibc
#   message). They need no credentials and no real release: fixture releases are served by a
#   local stand-in for GitHub (fake_github.py), both "internal" (token required) and "public".
#   These gate the deploy.
# - The real-release check ("real release, runs at public launch"): install the real latest
#   gizmodata/hardcharger release and query the server. While the releases are internal (an
#   anonymous request to github.com gets 404) these jobs say so in a notice and pass; that pass
#   is NOT coverage. Once the releases are public they run for real and must pass, with no flag
#   to flip.
#
# Triggers: every pull request and push (main's pushes run this through deploy.yml, which
# publishes only after it passes), hardcharger's releases (repository_dispatch
# `hardcharger-released`, client_payload.version), workflow_call (deploy.yml, release.yml), a
# weekly schedule (a backstop: GitHub disables a quiet repo's schedule after 60 days) and by hand.

on:
  # Documentation-only changes (README, CHANGELOG, docs/assets) don't touch the installers.
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  push:
    branches-ignore: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  repository_dispatch:
    types: [hardcharger-released]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: Hardcharger version for the real-release check (X.Y.Z). Empty = latest.
        required: false
        default: ''
        type: string
  workflow_call:
    inputs:
      version:
        description: Hardcharger version for the real-release check (X.Y.Z). Empty = latest.
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Superseded runs on a branch are cancelled, never a run on a tag. The prefix keeps this group
# apart from a caller's (deploy.yml, release.yml): a called workflow's github.workflow is the
# caller's name, and sharing the caller's group would deadlock the run.
concurrency:
  group: test-install-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  HC_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}

jobs:
  # ---- fixture tests: no credentials, gate the deploy ----------------------------------------
  lint:
    name: Lint and platform unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -s sh install.sh .github/scripts/*.sh
      - name: Syntax check with dash and bash
        run: dash -n install.sh && bash -n install.sh
      - name: fake_github.py compiles
        run: python3 -m py_compile .github/scripts/fake_github.py
      - name: Platform checks with fake uname/getconf/ldd (dash, bash)
        run: |
          .github/scripts/platform-tests.sh dash
          .github/scripts/platform-tests.sh bash
      - name: Parse and analyze the PowerShell scripts
        shell: pwsh
        run: |
          $t = $null; $e = $null
          foreach ($f in 'install.ps1', '.github/scripts/windows-tests.ps1', '.github/scripts/windows-real-release.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/$f", [ref]$t, [ref]$e) | Out-Null
            if ($e.Count) { $e; exit 1 }
          }
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error -EnableExit

  fixtures-unix:
    name: fixtures ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'linux-amd64 (ubuntu-24.04; dash, bash)', runner: ubuntu-24.04, shells: 'dash bash' }
          - { name: 'linux-arm64 (ubuntu-24.04-arm; dash)', runner: ubuntu-24.04-arm, shells: dash }
          - { name: 'macos-arm64 (macos-15; sh)', runner: macos-15, shells: sh }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Every scenario against fixture releases (internal with a token, and public)
        run: |
          for s in ${{ matrix.shells }}; do
            SH="$s" .github/scripts/fixture-scenarios.sh
          done

  fixtures-windows:
    name: fixtures ${{ matrix.name }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64 (windows-2025), runner: windows-2025 }
          - { name: windows-arm64 (windows-11-arm), runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell 7
        shell: pwsh
        run: ./.github/scripts/windows-tests.ps1
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          .\.github\scripts\windows-tests.ps1
          exit $LASTEXITCODE

  # Releases up to 0.2.0 were built on Ubuntu 24.04 and need glibc 2.38; the manylinux_2_28 builds
  # (glibc 2.28) come from hardcharger's branch feature/ci-speed. For a pinned version the
  # installer checks glibc before any network call, so this needs no release access.
  glibc-message:
    name: glibc message (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'debian-12 arm64, Raspberry Pi OS Bookworm base, glibc 2.36', runner: ubuntu-24.04-arm, image: 'debian:12', glibc: '2.36' }
          - { name: 'oraclelinux-8 amd64, glibc 2.28', runner: ubuntu-24.04, image: 'oraclelinux:8', glibc: '2.28' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - run: command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
      - uses: actions/checkout@v7
      - name: 0.2.0 is refused with the glibc explanation, before any download
        env:
          HARDCHARGER_INSTALL_GITHUB_API: http://127.0.0.1:9
          HARDCHARGER_INSTALL_GITHUB_WEB: http://127.0.0.1:9
        run: |
          set +e
          out="$(HARDCHARGER_VERSION=0.2.0 sh install.sh 2>&1)"; code=$?
          set -e
          printf '%s\n' "$out"
          [ "$code" != 0 ] || { echo "::error::0.2.0 installed on glibc ${{ matrix.glibc }}"; exit 1; }
          printf '%s\n' "$out" | grep -F "Hardcharger 0.2.0 for Linux needs glibc >= 2.38, and this system has glibc ${{ matrix.glibc }}." \
            || { echo "::error::the installer failed without the glibc explanation"; exit 1; }
          if printf '%s\n' "$out" | grep -F "Downloading"; then echo "::error::it downloaded before refusing"; exit 1; fi

  # ---- the real-release check: notice-and-pass while internal, real from public launch on --------
  real-release:
    name: real release, runs at public launch (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04, port: 31400 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, port: 31420 }
          - { name: macos-arm64, runner: macos-15, port: 31440 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Are gizmodata/hardcharger's releases public?
        id: vis
        run: echo "releases=$(.github/scripts/releases-public.sh)" >> "$GITHUB_OUTPUT"
      - name: Internal releases, so not run
        if: steps.vis.outputs.releases == 'internal'
        run: echo "::notice title=Real-release check not run::gizmodata/hardcharger releases are internal; the real-release check runs at public launch."
      - name: Install the real release, query the server, switch, downgrade, uninstall
        if: steps.vis.outputs.releases == 'public'
        env:
          HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
          PORT: ${{ matrix.port }}
          SH: sh
        run: .github/scripts/scenarios.sh "$HC_VERSION"

  real-release-container:
    name: real release, runs at public launch (${{ matrix.name }})
    needs: lint
    # All supported glibc platforms must pass the published-release walkthrough.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debian-13 container amd64, runner: ubuntu-24.04, image: 'debian:13' }
          - { name: 'debian-12 arm64, glibc 2.36', runner: ubuntu-24.04-arm, image: 'debian:12' }
          - { name: 'oraclelinux-8 amd64, glibc 2.28', runner: ubuntu-24.04, image: 'oraclelinux:8' }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - run: command -v curl >/dev/null || (apt-get update -qq && apt-get install -y -qq curl ca-certificates >/dev/null)
      - uses: actions/checkout@v7
      - name: Are gizmodata/hardcharger's releases public?
        id: vis
        run: echo "releases=$(.github/scripts/releases-public.sh)" >> "$GITHUB_OUTPUT"
      - name: Internal releases, so not run
        if: steps.vis.outputs.releases == 'internal'
        run: echo "::notice title=Real-release check not run::gizmodata/hardcharger releases are internal; the real-release check runs at public launch."
      - name: Install the real release, query the server, switch, downgrade, uninstall
        if: steps.vis.outputs.releases == 'public'
        env:
          HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
          SH: sh
        run: .github/scripts/scenarios.sh "$HC_VERSION"

  real-release-windows:
    name: real release, runs at public launch (${{ matrix.name }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-amd64, runner: windows-2025 }
          - { name: windows-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    env:
      HARDCHARGER_INSTALL_TOKEN: ${{ github.token }}
      HARDCHARGER_VERSION: ${{ inputs.version || github.event.client_payload.version || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: PowerShell 7
        shell: pwsh
        run: ./.github/scripts/windows-real-release.ps1
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          .\.github\scripts\windows-real-release.ps1
          exit $LASTEXITCODE

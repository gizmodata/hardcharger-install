name: Token probe (debug)

# Can this repo's GITHUB_TOKEN read gizmodata/hardcharger's (internal) releases? Prints status codes only.
on:
  push:
    branches: [main]
    paths: [.github/workflows/token-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for u in https://api.github.com/repos/gizmodata/hardcharger https://api.github.com/repos/gizmodata/hardcharger/releases/tags/v0.2.0 https://api.github.com/repos/gizmodata/hardcharger/releases/assets/651058930; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H @<(printf 'Authorization: Bearer %s\n' "$GH_TOKEN") -H 'Accept: application/octet-stream' "$u")
            echo "$code $u"
          done
